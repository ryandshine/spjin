# PDFin — Stirling-PDF (official image) for Dokploy (Docker Compose)
# Source of truth: https://docs.stirlingpdf.com/Server/Install/Docker/
# Domain/HTTPS are attached by Dokploy's Domains tab (Traefik labels + dokploy-network injected by Dokploy).
# Secrets come from Dokploy "Environment" (.env) — never commit them.
services:
  stirling-pdf:
    # Pinned to the version that `latest` resolved to at install time (2026-11-09) for reproducible rollback.
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:${STIRLING_VERSION:-3.3.0}
    restart: unless-stopped
    # Internal only — no host port published. Traefik reaches it over dokploy-network.
    expose:
      - "8080"
    environment:
      # --- Authentication (login mandatory, no anonymous access) ---
      SECURITY_ENABLELOGIN: "true"
      SECURITY_LOGINMETHOD: "normal"
      SECURITY_INITIALLOGIN_USERNAME: ${PDFIN_ADMIN_USERNAME:?set in Dokploy env}
      SECURITY_INITIALLOGIN_PASSWORD: ${PDFIN_ADMIN_PASSWORD:?set in Dokploy env}
      SECURITY_LOGINATTEMPTCOUNT: "5"
      SECURITY_LOGINRESETTIMEMINUTES: "120"
      SECURITY_XFRAMEOPTIONS: "DENY"
      # --- AI Engine: ON (approved by owner 2026-11-09) ---
      # Chat model = gemma4:cloud via host Ollama -> runs on Ollama Cloud (prompts/document text leave this server).
      # Embeddings = nomic-embed-text, runs locally in Ollama.
      AIENGINE_ENABLED: "true"
      AIENGINE_MODE: "SELF_HOSTED"
      AIENGINE_URL: "http://stirling-pdf-engine:5001"
      STIRLING_ENGINE_SHARED_SECRET: ${PDFIN_ENGINE_SECRET:?set in Dokploy env}
      AIENGINE_MODELS_PROVIDER: "ollama"
      AIENGINE_MODELS_SMARTMODEL: ${PDFIN_AI_MODEL:-gemma4:cloud}
      AIENGINE_MODELS_FASTMODEL: ${PDFIN_AI_MODEL:-gemma4:cloud}
      AIENGINE_MODELS_BASEURL: "http://host.docker.internal:11434/v1"
      AIENGINE_RAG_EMBEDDINGPROVIDER: "ollama"
      AIENGINE_RAG_EMBEDDINGMODEL: "nomic-embed-text"
      AIENGINE_RAG_EMBEDDINGBASEURL: "http://host.docker.internal:11434/v1"
      # --- telemetry / risky features OFF ---
      SYSTEM_ENABLEANALYTICS: "false"
      SYSTEM_ENABLEPOSTHOG: "false"
      SYSTEM_ENABLESCARF: "false"
      SYSTEM_ENABLEURLTOPDF: "false"
      SYSTEM_GOOGLEVISIBILITY: "false"
      SYSTEM_SHOWUPDATEONLYADMIN: "true"
      # --- Public URL behind Traefik ---
      SYSTEM_BACKENDURL: "https://pdfin.ditpps.com"
      SYSTEM_FRONTENDURL: "https://pdfin.ditpps.com"
      SYSTEM_DEFAULTLOCALE: "id-ID"
      SERVER_FORWARDHEADERSSTRATEGY: "native"
      # --- Runtime ---
      PUID: "1000"
      PGID: "1000"
      UMASK: "022"
      JAVA_CUSTOM_OPTS: "-XX:MaxRAMPercentage=70"
    volumes:
      - pdfin-configs:/configs          # settings.yml, H2 database + backup/db, keys
      - pdfin-storage:/storage          # server-side user file storage
      - pdfin-logs:/logs                # info.log, invalid-auths.log
      - pdfin-customfiles:/customFiles  # branding/static, signatures
      - pdfin-pipeline:/pipeline        # watchedFolders / finishedFolders
      - pdfin-tessdata:/usr/share/tessdata  # extra OCR languages (persist across recreate)
    mem_limit: 4g
    mem_reservation: 1g
    cpus: 4.0
    pids_limit: 2048
    healthcheck:
      test: ["CMD-SHELL", "curl -fs --max-time 10 http://localhost:8080/api/v1/info/status || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - stirling-pdf-engine
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Official AI engine (separate container, docs: Server/AI/Run-the-AI-Engine). Internal only, port 5001 not published.
  stirling-pdf-engine:
    image: ghcr.io/stirling-tools/stirling-engine:${STIRLING_VERSION:-3.3.0}
    restart: unless-stopped
    expose:
      - "5001"
    environment:
      STIRLING_ENGINE_SHARED_SECRET: ${PDFIN_ENGINE_SECRET:?set in Dokploy env}
      STIRLING_ENGINE_WORKERS: "2"
      STIRLING_POSTHOG_ENABLED: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pdfin-engine-data:/app/engine/data   # SQLite RAG index
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  pdfin-engine-data:
  pdfin-configs:
  pdfin-storage:
  pdfin-logs:
  pdfin-customfiles:
  pdfin-pipeline:
  pdfin-tessdata:
